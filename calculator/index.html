<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="index.css">
  <title>calculator</title>
</head>
<body>
  <div id="calcutor">
  <input type="text" id="display" readonly>
  <div class="container">
   <button class="button"
    onclick=" number  = ''; document.querySelector('#display').value =number;"
   >C</button>
    <button class="button"
  onclick=" number  = number +'1'; document.querySelector('#display').value =number;"
    >1</button>
     <button class="button" 
      onclick=" number  = number +'2'; document.querySelector('#display').value =number;"
     >2</button>
     <button class="button"
      onclick=" number  = number + '+'; document.querySelector('#display').value =number;"
     >+</button>
     <button class="button"
      onclick=" number  = number +'3'; document.querySelector('#display').value =number;"
     >3</button>
     <button class="button"
      onclick=" number  = number +'4'; document.querySelector('#display').value =number;"
     >4</button>
      <button class="button"
       onclick=" number  = number+'-'; document.querySelector('#display').value =number;"
      >-</button>
       <button class="button"
        onclick=" number  = number +'5'; document.querySelector('#display').value =number;"
       >5</button>
        <button class="button"
         onclick=" number  = number +'6'; document.querySelector('#display').value =number;"
        >6</button>
         <button class="button"
          onclick=" number  =  number+'*'; document.querySelector('#display').value =number;"
         >*</button>
          <button class="button"
           onclick=" number  = number +'7'; document.querySelector('#display').value =number;"
          >7</button>
         <button class="button"
          onclick=" number  = number +'8'; document.querySelector('#display').value =number;"
         >8</button>
        <button class="button"
         onclick=" number  = number+'/'; document.querySelector('#display').value =number;"
        >/</button>
        <button class="button"
         onclick=" number  = eval(number); document.querySelector('#display').value =number;"
        >=</button>
        <button class="button"
         onclick=" number  = number +'9'; document.querySelector('#display').value =number;"
        >9</button>
       <button class="button"
        onclick=" number  = number +'0'; document.querySelector('#display').value =number;"
       >0</button>
        <button class="button1"
         onclick=" number  = number +'.'; document.querySelector('#display').value =number;"
        >.</button>
        <script>
          let number = '';
            document.querySelector('.display').value = number;
        </script>
  </div>
  </div>
</body>
</html>
